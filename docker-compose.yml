version: "3.8"

services:
  db:
    image: postgres:15
    container_name: tgshop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tgshop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Одноразовая миграция основной БД
  migrate:
    build: .
    container_name: tgshop_migrate
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    # Выполняем и выходим с кодом 0/1 (без перезапуска)
    restart: "no"
    command: >
      sh -c "alembic upgrade head"

  # Одноразовая миграция ТЕСТОВОЙ БД (запускается вручную, под профилем test)
  migrate_test:
    build: .
    container_name: tgshop_migrate_test
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c "alembic upgrade head"
    profiles: ["test"]

  app:
    build: .
    container_name: tgshop_app
    working_dir: /app
    volumes:
      - ./:/app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m app.bot.main"

volumes:
  db_data:
